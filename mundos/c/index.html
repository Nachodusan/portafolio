<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dusan — Tipografía y colgante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<style>
:root{ --flood:#2F18FF; --ink:#07070A; --paper:#F2F1EC; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--flood);color:var(--ink);
  font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .8s cubic-bezier(.2,.9,.1,1)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

/* ---------- puerta ---------- */
#gate{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity .7s ease,visibility .7s}
#gate.off{opacity:0;visibility:hidden}
#gate h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.8rem,6.4vw,4rem);
  letter-spacing:-.045em;line-height:.9;text-transform:uppercase;text-align:center;margin:0;padding:0 24px}
#gate p{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;opacity:.55;margin:0;text-align:center;padding:0 24px;line-height:1.9}
#enter{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid var(--paper);padding:14px 32px;min-height:48px;transition:.2s}
#enter:hover{background:var(--paper);color:var(--ink)}

/* ---------- colgante ---------- */
#badge3d{position:fixed;z-index:8;top:0;right:0;height:100%;width:46vw;
  display:block;touch-action:none;cursor:grab}
#badge3d:active{cursor:grabbing}

/* ---------- tipografía ---------- */
#stage{position:fixed;inset:0;z-index:5;perspective:1400px;perspective-origin:5% 50%;overflow:hidden}
#deck{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.word{
  position:absolute;top:40%;left:max(26px,env(safe-area-inset-left,0px));
  width:max-content;max-width:62vw;
  font-family:'Archivo Black',sans-serif;text-transform:uppercase;
  font-size:clamp(1.7rem,6.6vw,6.2rem);line-height:.84;letter-spacing:-.05em;
  margin:0;white-space:nowrap;transform-style:preserve-3d;cursor:pointer;
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.1,1);
}
.word.past{opacity:.12}.word.next{opacity:.2}.word.now{opacity:1}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:20;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;line-height:1.85}
.hud--tl{top:max(18px,env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px))}
.hud--bl{bottom:max(18px,env(safe-area-inset-bottom,0px));left:max(20px,env(safe-area-inset-left,0px))}
.hud--br{bottom:max(18px,env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));text-align:right}
.hud--tr{top:max(18px,env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));text-align:right}
.hud b{font-weight:500}.hud .dim{opacity:.52}
.hud a{border-bottom:1px solid transparent}.hud a:hover{border-bottom-color:currentColor}
.idx{display:flex;gap:13px;flex-wrap:wrap;justify-content:flex-end}
.idx button{font:inherit;letter-spacing:.14em;opacity:.42;transition:opacity .2s;min-height:24px}
.idx button[aria-current="true"]{opacity:1;font-weight:500}
.idx button:hover{opacity:.85}
#hue{margin-top:9px;opacity:.52}#hue:hover{opacity:1}

/* ---------- panel ---------- */
#panel{position:fixed;z-index:40;left:max(20px,env(safe-area-inset-left,0px));
  bottom:max(72px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 40px));
  background:var(--ink);color:var(--paper);padding:22px 24px;
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .35s,visibility .35s,transform .35s}
#panel.on{opacity:1;visibility:visible;transform:none}
#panel h2{font-family:'Archivo Black',sans-serif;font-size:17px;text-transform:uppercase;
  letter-spacing:-.02em;margin:0 0 10px}
#panel p{margin:0;font-size:13px;line-height:1.55;opacity:.84}
#panel .chips{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0 0;list-style:none;padding:0}
#panel .chips li{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  border:1px solid rgba(242,241,236,.3);padding:3px 7px}
#panel .go{display:inline-block;margin-top:14px;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid currentColor}
#panel .x{position:absolute;top:12px;right:15px;font-family:'JetBrains Mono',monospace;font-size:13px;opacity:.6}

#hint{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right,0px));
  top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;opacity:.4;pointer-events:none;white-space:nowrap}

@media (max-width:820px){
  #badge3d{width:100%;height:42vh;top:0}
  #stage{top:42vh;height:58vh;inset:auto 0 0 0;perspective-origin:50% 50%}
  .word{max-width:92vw;font-size:clamp(1.5rem,8.4vw,3rem);left:50%}
  #hint{display:none}
  #panel{bottom:max(14px,env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate">
  <p>Ignacio Duque Sandoval · dusan.codes</p>
  <h1>AI Trainer<br>Full-Stack + Mobile</h1>
  <button id="enter" type="button">Entrar</button>
</div>

<canvas id="badge3d" aria-label="Gafete 3D arrastrable"></canvas>
<div id="stage"><div id="deck"></div></div>

<div class="hud hud--tl"><b>Dusan</b><br><span class="dim">Ignacio Duque Sandoval</span></div>
<div class="hud hud--tr">
  <div class="idx" id="idx"></div>
  <div><button id="hue" type="button">◼ color</button></div>
</div>
<div class="hud hud--bl">
  <span class="dim">Disponible · 2026</span><br>
  LLM eval · RAG · MLX<br>
  React · Python · Kotlin · Flutter
</div>
<div class="hud hud--br">
  <a href="https://github.com/Nachodusan" target="_blank" rel="noopener noreferrer">GitHub</a> ·
  <a href="https://www.linkedin.com/in/ignacio-d-361698102/" target="_blank" rel="noopener noreferrer">LinkedIn</a> ·
  <a href="../../cv.pdf" target="_blank" rel="noopener noreferrer">CV</a><br>
  <span class="dim">dusanemp@gmail.com</span><br>
  <a href="../">← los mundos</a>
</div>
<div id="hint">arrastrá el gafete · rueda para cambiar</div>

<div id="panel">
  <button class="x" id="panelx" type="button" aria-label="Cerrar">✕</button>
  <h2 id="p-t"></h2>
  <p id="p-d"></p>
  <ul class="chips" id="p-c"></ul>
  <a class="go" id="p-g" target="_blank" rel="noopener noreferrer"></a>
</div>

<script>
const ITEMS = [
  { w:"Bitácora", t:"Bitácora", d:"Diario hablado para acompañar la terapia. Apps nativas en SwiftUI y Jetpack Compose con transcripción de voz en el dispositivo: el audio no sale del teléfono. Memoria larga con pgvector y guardas duplicadas en cliente y servidor.",
    c:["SwiftUI","Kotlin · Compose","Node 22 + Fastify","pgvector","RAG"], u:"https://github.com/Nachodusan/bitacora-app" },
  { w:"Tutor IA", t:"Tutor IA", d:"Facilitador de aprendizaje sobre el material oficial del Mineduc. RAG de doble corpus tipado, retrieval híbrido con reranker como gate de abstención y verificación NLI por oración: si no está en el material, se abstiene.",
    c:["TypeScript","Next.js","pgvector","bge-m3","Reranker","NLI"], u:"https://github.com/Nachodusan/tutor-ia" },
  { w:"Che IA", t:"Che IA", d:"Asistente de voz rioplatense corriendo end-to-end en Apple Silicon. Llama 3.1 8B sobre MLX con RAG sobre 319 ejemplos curados. Tres iteraciones de fine-tuning LoRA medidas y descartadas: prompt más retrieval rindió mejor.",
    c:["Llama 3.1 8B (MLX)","BM25","Piper TTS","FastAPI"], u:"https://github.com/Nachodusan/ia-rioplatense" },
  { w:"In The Box", t:"Plataforma de comercio electrónico", d:"Gestión de productos e inventario, panel administrativo para ventas, APIs para manejo dinámico de datos e interfaz responsiva.",
    c:["React","JavaScript","REST APIs","PostgreSQL"], u:"https://github.com/Nachodusan/inthebox" },
  { w:"Entreno IA", t:"Entrenador de IA", d:"Diseño y entreno modelos adaptados a cada caso: fine-tuning de LLMs, pipelines RAG e inferencia local optimizada. Curado de datasets, evaluación rigurosa y decisión técnica sobre cuándo entrenar, recuperar o combinar.",
    c:["LLMs","Fine-tuning","RAG","Embeddings","MLX · PyTorch"], u:"https://github.com/Nachodusan" },
  { w:"Backend", t:"Backend robusto", d:"APIs seguras y bases de datos optimizadas con Node y SQL. Arquitectura de sistemas y construcción de aplicaciones end-to-end, cuidando estructura, validación, automatización y despliegue.",
    c:["Node.js","PostgreSQL","MongoDB","REST APIs"], u:"https://github.com/Nachodusan" },
  { w:"Mobile", t:"Mobile nativo", d:"Experiencias nativas para iOS y Android: Flutter para velocidad de iteración, Kotlin para integración nativa profunda. Push, geolocalización, modo offline y 60fps.",
    c:["SwiftUI","Jetpack Compose","Flutter","Kotlin"], u:"https://github.com/Nachodusan" }
];
const FLOODS = ["#2F18FF","#00E5C5","#FF4D2E","#C8FF1E","#F2F1EC"];
let flood = 0;

const deck = document.getElementById('deck');
const idx  = document.getElementById('idx');
const panel = document.getElementById('panel');

function extrude(depth){
  let s = [];
  for (let i = 1; i <= depth; i++) s.push(`${i*0.052}em ${i*0.052}em 0 var(--ink)`);
  return s.join(',');
}

ITEMS.forEach((it, i) => {
  const h = document.createElement('h2');
  h.className = 'word'; h.textContent = it.w; h.tabIndex = 0; h.setAttribute('role','button');
  h.addEventListener('click', () => { go(i); openPanel(i); });
  h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(i); openPanel(i); } });
  deck.appendChild(h);
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = String(i+1).padStart(2,'0');
  b.addEventListener('click', () => go(i));
  idx.appendChild(b);
});

const words = [].slice.call(deck.children);
let cur = 0;
const narrow = () => matchMedia('(max-width:820px)').matches;

function layout(){
  const h = narrow() ? window.innerHeight * 0.58 : window.innerHeight;
  const gapY = Math.min(h * 0.155, 118);
  words.forEach((w, i) => {
    const d = i - cur;
    const cx = narrow() ? 'translateX(-50%) ' : '';
    w.style.transform = `${cx}translateY(-50%) translate3d(0, ${d*gapY}px, ${-Math.abs(d)*150}px) rotateX(${d*-5}deg)`;
    w.classList.toggle('now', d === 0);
    w.classList.toggle('past', d < 0);
    w.classList.toggle('next', d > 0);
    w.style.textShadow = Math.abs(d) <= 1 ? extrude(d === 0 ? 12 : 5) : 'none';
    w.style.zIndex = String(12 - Math.abs(d));
  });
  [].forEach.call(idx.children, (b, i) => b.setAttribute('aria-current', i === cur ? 'true' : 'false'));
}
function go(i){ cur = Math.max(0, Math.min(ITEMS.length - 1, i)); layout(); }
layout();

let lock = false;
window.addEventListener('wheel', e => {
  if (lock) return;
  lock = true; setTimeout(() => lock = false, 250);
  go(cur + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') go(cur+1);
  if (e.key === 'ArrowUp') go(cur-1);
  if (e.key === 'Escape') panel.classList.remove('on');
});
let ty = null;
document.getElementById('stage').addEventListener('touchstart', e => ty = e.touches[0].clientY, { passive:true });
document.getElementById('stage').addEventListener('touchend', e => {
  if (ty === null) return;
  const dy = ty - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) go(cur + (dy > 0 ? 1 : -1));
  ty = null;
}, { passive:true });

/* paralaje suave de la tipografía (el gafete tiene su propia física) */
let tx = 0, tyy = 0, rx = 0, ry = 0;
window.addEventListener('pointermove', e => {
  tx = (e.clientX / window.innerWidth - .5);
  tyy = (e.clientY / window.innerHeight - .5);
});
(function loop(){
  ry += (tx * 13 - ry) * .06;
  rx += (-tyy * 8 - rx) * .06;
  deck.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  requestAnimationFrame(loop);
})();

function openPanel(i){
  const it = ITEMS[i];
  document.getElementById('p-t').textContent = it.t;
  document.getElementById('p-d').textContent = it.d;
  document.getElementById('p-c').innerHTML = it.c.map(c => '<li>'+c+'</li>').join('');
  const g = document.getElementById('p-g');
  g.href = it.u; g.textContent = it.u.replace('https://','') + ' ↗';
  panel.classList.add('on');
}
document.getElementById('panelx').addEventListener('click', () => panel.classList.remove('on'));

document.getElementById('hue').addEventListener('click', () => {
  flood = (flood + 1) % FLOODS.length;
  document.documentElement.style.setProperty('--flood', FLOODS[flood]);
});
document.getElementById('enter').addEventListener('click', () => {
  document.getElementById('gate').classList.add('off');
});
window.addEventListener('resize', layout);
</script>
<script type="module" src="../../badge3d.js"></script>
</body>
</html>
